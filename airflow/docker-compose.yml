# Local Airflow (LocalExecutor) + Spark standalone cluster for TrustGraph.
# Sized for a Docker VM with ~8 GB RAM.
x-airflow-common: &airflow-common
  build: .
  image: trustgraph-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark%3A%2F%2Fspark-master:7077?deploy-mode=client"
    TRUSTGRAPH_LAKE: /opt/airflow/lake
    TRUSTGRAPH_EXPORT: /opt/airflow/export
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./lake:/opt/airflow/lake
    - ../data:/opt/airflow/export
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Trust --lastname Graph --role Admin --email admin@example.com || true
    user: "50000:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    mem_limit: 1g

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    hostname: airflow-scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    mem_limit: 2g

  spark-master:
    <<: *airflow-common
    hostname: spark-master
    command: ["bash", "-c", "spark-class org.apache.spark.deploy.master.Master --host spark-master --webui-port 8082"]
    ports: ["8082:8082", "7077:7077"]
    depends_on: []
    mem_limit: 768m

  spark-worker:
    <<: *airflow-common
    hostname: spark-worker
    command: ["bash", "-c", "spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081"]
    ports: ["8081:8081"]
    depends_on: [spark-master]
    mem_limit: 3g

volumes:
  pgdata:
